<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation de réservation</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #F5EFE0; margin: 0; padding: 0; }
        .wrapper { max-width: 580px; margin: 0 auto; background: #ffffff; }
        .header { background: #1A3A3A; padding: 32px 40px; text-align: center; }
        .header h1 { color: #ffffff; font-size: 1.5rem; margin: 0; }
        .header .accent { display: block; width: 40px; height: 2px; background: #C8A96E; margin: 12px auto 0; }
        .body { padding: 40px; }
        .greeting { font-size: 1.05rem; color: #1A3A3A; margin-bottom: 24px; }
        .recap { background: #E8F4F4; border-radius: 10px; padding: 24px; margin-bottom: 28px; }
        .recap h2 { color: #2C6B6B; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 16px; }
        .recap-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(44,107,107,0.1); font-size: 0.95rem; }
        .recap-row:last-child { border-bottom: none; }
        .recap-label { color: #6B7280; }
        .recap-value { color: #1A3A3A; font-weight: 600; }
        .code-box { background: #1A3A3A; border-radius: 10px; padding: 24px; text-align: center; margin-bottom: 28px; }
        .code-label { color: rgba(255,255,255,0.7); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
        .code { color: #C8A96E; font-size: 1.8rem; font-weight: 700; letter-spacing: 0.15em; font-family: monospace; }
        .qr-section { text-align: center; margin-bottom: 28px; }
        .qr-section p { color: #6B7280; font-size: 0.88rem; margin-bottom: 12px; }
        .qr-section img { width: 140px; height: 140px; border: 4px solid #E8F4F4; border-radius: 8px; }
        .btn { display: block; background: #2C6B6B; color: #ffffff; text-decoration: none; padding: 14px 28px; border-radius: 10px; text-align: center; font-weight: 600; margin-bottom: 28px; }
        .note { background: #FEF3C7; border-left: 3px solid #C8A96E; padding: 16px; border-radius: 0 8px 8px 0; font-size: 0.9rem; color: #92400E; margin-bottom: 28px; }
        .footer { background: #1A3A3A; padding: 24px 40px; text-align: center; }
        .footer p { color: rgba(255,255,255,0.5); font-size: 0.82rem; margin: 4px 0; }
        /* Séparateur annonçant la version anglaise */
        .lang-separator {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #C8A96E;
            border-top: 1px solid #C8A96E;
            border-bottom: 1px solid #C8A96E;
            padding: 12px 0;
            margin: 32px 0;
        }
    </style>
</head>
<body>
    <div class="wrapper">

        <div class="header">
            <h1>Résidences Bereby</h1>
            <span class="accent"></span>
        </div>

        <div class="body">

            <!-- Version française, puis la version anglaise
                 (contenus injectés tels quels par emails.py) -->
            {{ fr_content|safe }}

            <!-- Séparateur annonçant la version anglaise -->
            <div class="lang-separator">English version will follow</div>

            {{ en_content|safe }}

        </div>

        <div class="footer">
            <p>Résidences Bereby | Grand-Béréby, Côte d'Ivoire</p>
            <p>Cet email a été envoyé automatiquement, merci de ne pas y répondre directement.</p>
        </div>

    </div>
</body>
</html>
